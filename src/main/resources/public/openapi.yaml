openapi: 3.0.0
info:
  title: STEDI API
  description: |
    API documentation for the STEDI application
    
    ## Authentication
    Most endpoints require authentication using a session token obtained from the `/login` endpoint.
    
    **Required Header:**
    - `suresteps.session.token`: Session token value (UUID format)
    
    **Authentication Flow:**
    1. Call `/login` with username and password to get a session token
    2. Include the token in the `suresteps.session.token` header for authenticated requests
    3. Use `/validate/{token}` to verify token validity
    
    ## Two-Factor Authentication
    The API supports 2FA via SMS and WhatsApp:
    - Request OTP: `/twofactorlogin/{phoneNumber}`
    - Verify OTP: `/twofactorlogin` (POST with phoneNumber and oneTimePassword)

    ## Phone-only accounts, family profiles and two-round tests
    Added alongside the routes above (none of the older routes changed):
    - **Sign-up without a password:** `/signup/start` texts a 4-digit code, `/signup/verify` checks it,
      creates the account (with a required recovery email) and returns a session token.
    - **Account recovery** for a new phone number: `/recovery/start` (email code) → `/recovery/verify`
      (code texted to the new phone) → `/recovery/confirm` (account moved, session token returned).
    - **Profiles:** one account holds the account holder's own profile plus family members, who have no
      login of their own. Preferences and tests belong to a profile (`/profiles/{id}/...`).
    - **Ownership:** every profile, preferences, test and device route only works for the account that
      owns the item. Anything else (missing or someone else's) answers 404.
    - **Codes** are 4 digits, last 10 minutes and allow 5 wrong guesses.
  version: 1.0.0

servers:
  - url: https://dev.stedi.me/
    description: Development server
  - url: http://localhost:4567
    description: Local development server

components:
  securitySchemes:
    sessionToken:
      type: apiKey
      name: suresteps.session.token
      in: header
  schemas:
    DeviceMessage:
      type: object
      properties:
        messageOrigin:
          type: string
          example: DEVICE
        sessionKey:
          type: string
          nullable: true
        message:
          type: string
          example: "Sample update from spotter-7"
        deviceId:
          type: string
          example: spotter-7.stedi.local
        date:
          type: number
          format: int64
          example: 1659538351527
        sensorType:
          type: string
          example: ultraSonicSensor
        distance:
          type: string
          example: 1cm
        timestamp:
          type: number
          format: int64
          example: 1659538351527

    User:
      type: object
      properties:
        userName:
          type: string
          format: email
          example: user@example.com
          description: User's email address (used as username)
        password:
          type: string
          description: User's password (only used for input, never returned)
        phone:
          type: string
          example: "+18017190908"
          description: User's phone number in international format
        whatsAppPhone:
          type: string
          example: "+18017190908"
          description: User's WhatsApp phone number
        email:
          type: string
          format: email
          example: user@example.com
          description: User's email address
        birthDay:
          type: string
          example: "08151990"
          description: User's birth date in MMDDYYYY format
        gender:
          type: string
          example: "M"
          description: User's gender
        region:
          type: string
          example: "US"
          description: User's region code
        expoPushToken:
          type: string
          example: "ExponentPushToken[abc123]"
          description: Expo push notification token for mobile app
        deviceNickName:
          type: string
          example: "MyDevice"
          description: Nickname for user's device
        agreedToTermsOfUseDate:
          type: number
          format: int64
          example: 1659538351527
          description: Timestamp when user agreed to terms of use
        agreedToPrivacyPolicyDate:
          type: number
          format: int64
          example: 1659538351527
          description: Timestamp when user agreed to privacy policy
        agreedToCookiePolicyDate:
          type: number
          format: int64
          example: 1659538351527
          description: Timestamp when user agreed to cookie policy
        agreedToTextMessageDate:
          type: number
          format: int64
          example: 1659538351527
          description: Timestamp when user agreed to receive text messages
        agreedToShareAnonymousData:
          type: number
          format: int64
          example: 1659538351527
          description: Timestamp when user agreed to share anonymous data for research purposes
        locked:
          type: boolean
          example: false
          description: Whether the user account is locked

    Customer:
      type: object
      properties:
        customerName:
          type: string
          example: "John Doe"
          description: Customer's full name
        email:
          type: string
          format: email
          example: "customer@example.com"
          description: Customer's email address
        phone:
          type: string
          example: "+18017190908"
          description: Customer's phone number in international format
        whatsAppPhone:
          type: string
          example: "+18017190908"
          description: Customer's WhatsApp phone number
        birthDay:
          type: string
          example: "08151990"
          description: Customer's birth date in MMDDYYYY format
        region:
          type: string
          example: "US"
          description: Customer's region code
        weight:
          type: number
          format: int64
          example: 150
          description: Customer's weight (in pounds or kilograms)
        height:
          type: number
          format: int64
          example: 70
          description: Customer's height (in inches or centimeters)
        lastWalkerDate:
          type: string
          format: date-time
          example: "2023-08-15T10:30:00Z"
          description: Date of customer's last walker usage
        gender:
          type: string
          example: "M"
          description: Customer's gender

    RapidStepTest:
      type: object
      description: One round saved by the older POST /rapidsteptest (returned by GET /stephistory/{email}).
      properties:
        customer: { type: string, format: email }
        startTime: { type: integer, format: int64 }
        stopTime: { type: integer, format: int64 }
        testTime: { type: integer, format: int64 }
        stepPoints: { type: array, items: { type: integer, format: int64 } }
        totalSteps: { type: integer, example: 30 }
        deviceId: { type: string, nullable: true }
        feelingScore: { type: integer, nullable: true }

    ErrorPayload:
      type: object
      description: The error body returned by the profile, preferences, test and device routes.
      properties:
        errorMessage:
          type: string
          example: Profile not found

    Profile:
      type: object
      properties:
        profileId: { type: string, example: 3f9a1c2e-5b7d-4e8f-9a0b-1c2d3e4f5a6b }
        ownerUserName: { type: string, example: alexmorgan }
        self: { type: boolean, description: True for the account holder's own profile (created automatically) }
        fullName: { type: string, example: Jordan Morgan }
        birthDay: { type: string, format: date, example: "1960-09-08", nullable: true }
        gender: { type: string, enum: [woman, man, non_binary, prefer_not_to_say], nullable: true }
        relationship: { type: string, enum: [self, parent, child, partner, sibling, grandparent, friend, other] }
        heightCm: { type: number, example: 178.0, nullable: true }
        weightKg: { type: number, example: 80.5, nullable: true }
        avatarColor: { type: string, enum: [green, coral, violet, sky] }
        createdAt: { type: integer, format: int64, example: 1794300000000 }

    ProfileRequest:
      type: object
      description: |
        For POST (add a family member) fullName and relationship are required.
        For PATCH every field is optional; fields left out are not changed.
      properties:
        fullName: { type: string, maxLength: 80, example: Jordan Morgan }
        birthDay: { type: string, format: date, example: "1960-09-08" }
        gender: { type: string, enum: [woman, man, non_binary, prefer_not_to_say] }
        relationship: { type: string, enum: [parent, child, partner, sibling, grandparent, friend, other] }
        heightCm: { type: number, minimum: 40, maximum: 250 }
        weightKg: { type: number, minimum: 2, maximum: 350 }
        clearHealthMetrics: { type: boolean, description: true removes height and weight ("Not shared") }

    BalancePreferences:
      type: object
      properties:
        profileId: { type: string }
        feeling: { type: string, enum: [poor, fair, ok, good, great], description: "How do you feel about your balance today?" }
        improveGoal: { type: integer, minimum: 1, maximum: 10, description: "How much do you want to improve?" }
        referralSource: { type: string, enum: [clinician, physical_therapist, friend_family, social_media, other], nullable: true }
        updatedAt: { type: integer, format: int64 }

    TestRound:
      type: object
      required: [round, startTime, stepPoints]
      properties:
        round: { type: integer, enum: [1, 2] }
        startTime: { type: integer, format: int64, description: When the round started (ms since 1970) }
        stepPoints:
          type: array
          description: Milliseconds between steps; the first is from startTime to step 1 (same meaning as RapidStepTest). 30 for a finished round.
          items: { type: integer, format: int64, minimum: 1, maximum: 120000 }
          example: [820, 790, 805]
        stopTime: { type: integer, format: int64, readOnly: true, description: startTime + all stepPoints }
        durationMs: { type: integer, format: int64, readOnly: true }
        avgIntervalMs: { type: integer, format: int64, readOnly: true, nullable: true }

    BalanceTest:
      type: object
      properties:
        testId: { type: string, readOnly: true }
        clientTestId: { type: string, description: A UUID made by the app. Sending the same one again returns the first copy instead of saving a duplicate. }
        profileId: { type: string, readOnly: true }
        userName: { type: string, readOnly: true }
        deviceId: { type: string, nullable: true, example: STEDI-0241, description: Defaults to the account's active device }
        status: { type: string, enum: [complete, stopped], description: "complete = 2 rounds of 30 steps; stopped = ended early (saved, never scored)" }
        rounds: { type: array, items: { $ref: '#/components/schemas/TestRound' } }
        startedAt: { type: integer, format: int64, readOnly: true }
        completedAt: { type: integer, format: int64, readOnly: true }
        stepCount: { type: integer, readOnly: true, example: 60 }
        totalTimeMs: { type: integer, format: int64, readOnly: true, example: 48200 }
        avgIntervalMs: { type: integer, format: int64, readOnly: true, nullable: true, example: 803 }
        score: { type: number, readOnly: true, nullable: true, description: 0-100 balance score. Null until the clinical formula is added to ScoreCalculator. }
        scoreVersion: { type: string, readOnly: true, example: pending }

    BalanceTestRequest:
      type: object
      required: [clientTestId, status, rounds]
      properties:
        clientTestId: { type: string, pattern: "^[A-Za-z0-9-]{8,64}$", example: 9b2e7c1a-3d4f-4a5b-8c6d-7e8f9a0b1c2d }
        status: { type: string, enum: [complete, stopped] }
        deviceId: { type: string, example: STEDI-0241 }
        rounds:
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: object
            required: [round, startTime, stepPoints]
            properties:
              round: { type: integer, enum: [1, 2] }
              startTime: { type: integer, format: int64 }
              stepPoints: { type: array, items: { type: integer, format: int64 } }

    UserDevice:
      type: object
      properties:
        deviceId: { type: string, example: STEDI-0241 }
        ownerUserName: { type: string }
        nickname: { type: string, example: "STEDI · 0241" }
        location: { type: string, nullable: true, example: Living room }
        active: { type: boolean, description: The device tests use (also copied to User.deviceNickName) }
        pairedAt: { type: integer, format: int64 }
        lastUsedAt: { type: integer, format: int64, nullable: true }
        connectedNow: { type: boolean, description: True if the sensor sent a reading in the last 2 minutes }

  responses:
    Unauthorized:
      description: Missing or invalid session token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorPayload' }
    BadRequest:
      description: A field is missing or not allowed (errorMessage says which)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorPayload' }
    NotFound:
      description: Doesn't exist, or belongs to another account
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorPayload' }
    Conflict:
      description: Already exists
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorPayload' }

  parameters:
    ProfileId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: profileId from GET /profiles
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string }
      example: STEDI-0241

paths:
  /simulation:
    get:
      summary: Get simulation status
      responses:
        '200':
          description: Whether simulation is active
          content:
            text/plain:
              schema:
                type: boolean
    post:
      summary: Start simulated customer data
      description: Requires the server environment variable ENABLE_SIMULATION_MODE=true (or SIMULATION=true, which also starts the simulation at startup).
      responses:
        '200':
          description: Simulation start request accepted
        '403':
          description: Simulation mode is disabled on the server
    delete:
      summary: Stop simulated customer data
      responses:
        '200':
          description: Simulation stop request accepted
  /login:
    post:
      summary: Log in to STEDI
      description: Authenticate user and obtain a session token for subsequent API calls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userName
                - password
              properties:
                userName:
                  type: string
                  format: email
                  example: user@test.com
                  description: User's email address
                password:
                  type: string
                  example: P@ssw0rd
                  description: User's password
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: string
                description: Session token (UUID format)
                example: e16b6030-433d-4287-ac1b-df500851e8da
        '401':
          description: Invalid credentials

  /rapidsteptest:
    post:
      summary: Save Steps
      description: Save step test data including timing and step measurements
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer
                - startTime
                - stepPoints
                - stopTime
                - testTime
                - totalSteps
                - deviceId
              properties:
                customer:
                  type: string
                  format: email
                  example: user@test.com
                  description: Customer email address
                startTime:
                  type: number
                  example: 1659538351527
                  description: Test start time (timestamp)
                stepPoints:
                  type: array
                  items:
                    type: number
                  example: [3615, 1165, 756, 309, 200, 172, 166, 171, 166, 172, 171, 186, 172, 180, 165, 179, 192, 172, 178, 173, 172, 180, 165, 179, 192, 172, 178, 173, 178, 180]
                  description: Array of step measurement points
                stopTime:
                  type: number
                  example: 1659538363373
                  description: Test stop time (timestamp)
                testTime:
                  type: number
                  example: 11846
                  description: Total test duration in milliseconds
                totalSteps:
                  type: number
                  example: 30
                  description: Total number of steps recorded
                deviceId:
                  type: string
                  example: "007"
                  description: Device identifier
      responses:
        '200':
          description: Steps saved successfully
        '401':
          description: Unauthorized - Invalid or missing session token

  /sensorUpdates:
    post:
      summary: Send Sensor Updates
      description: Send sensor data updates from connected devices to the STEDI platform for processing and routing to interested sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - deviceId
                - sensorType
                - distance
                - timestamp
              properties:
                deviceId:
                  type: string
                  example: "007"
                  description: Unique identifier for the device sending the sensor data
                sensorType:
                  type: string
                  example: "ultraSonicSensor"
                  description: Type of sensor providing the data (e.g., ultraSonicSensor, accelerometer, gyroscope)
                distance:
                  type: string
                  example: "1cm"
                  description: Distance measurement from ultrasonic sensor
                timestamp:
                  type: number
                  example: 1659538351527
                  description: Timestamp when the sensor reading was captured (Unix timestamp in milliseconds)
                message:
                  type: string
                  example: "Test Completed"
                  description: Unstructured message or status text from the device
                messageOrigin:
                  type: string
                  example: "DEVICE"
                  description: Origin type of the message (typically "DEVICE" for sensor updates)
                date:
                  type: number
                  example: 1659538351527
                  description: Timestamp when the sensor data was captured (Unix timestamp in milliseconds)
      responses:
        '200':
          description: Sensor data accepted and routed successfully
          content:
            application/json:
              schema:
                type: string
                example: "Accepted"
        '400':
          description: Invalid sensor data format or missing required fields
        '500':
          description: Internal server error processing sensor data

  /devices/updates/recent:
    get:
      summary: Get recent updates for the caller's device
      description: |
        Returns sensor updates for the authenticated user's device in the last N seconds.
        The user's device is inferred from their `deviceNickName` profile field.
      security:
        - sessionToken: []
      parameters:
        - name: seconds
          in: query
          required: false
          schema:
            type: integer
            default: 60
            minimum: 1
          description: Time window in seconds to look back for updates
      responses:
        '200':
          description: Recent device updates returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceMessage'
        '400':
          description: Missing device nickname or invalid parameter
        '401':
          description: Unauthorized - Invalid or missing session token
        '500':
          description: Error querying recent device updates

  /riskscore/{email}:
    get:
      summary: Get Risk Score
      security:
        - sessionToken: []
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Risk score retrieved successfully

  /stephistory/{email}:
    get:
      summary: Get Step History
      description: Get step test history for the authenticated user by email address
      security:
        - sessionToken: []
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
            format: email
          description: Customer email address
      responses:
        '200':
          description: Step history retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RapidStepTest'
        '400':
          description: Bad request or invalid parameters
        '401':
          description: Unauthorized - Invalid or missing session token
        '404':
          description: Customer not found or access denied
        '412':
          description: Precondition failed

  /validate/{token}:
    get:
      summary: Validate Token
      description: Validate a session token and retrieve associated email address
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: f4f4f3b3-1d35-488c-af13-f2fd095567cf
          description: Session token to validate
      responses:
        '200':
          description: Token validated successfully
          content:
            application/json:
              schema:
                type: string
                description: Email address associated with the token
        '401':
          description: Invalid token

  /twofactorlogin/{phoneNumber}:
    post:
      summary: Request 2FA OTP
      description: Request a one-time password via SMS or WhatsApp
      parameters:
        - name: phoneNumber
          in: path
          required: true
          schema:
            type: string
          example: "8017190908"
          description: Phone number to send OTP to
        - name: whatsApp
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Send via WhatsApp instead of SMS
        - name: region
          in: query
          required: false
          schema:
            type: string
            default: "US"
          description: Region code for WhatsApp messages
      responses:
        '200':
          description: OTP sent successfully

  /twofactorlogin:
    post:
      summary: Convert OTP to Token
      description: Verify OTP and receive session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phoneNumber
                - oneTimePassword
              properties:
                phoneNumber:
                  type: string
                  example: "8017190908"
                  description: Phone number that received the OTP
                oneTimePassword:
                  type: number
                  example: 8936
                  description: One-time password received via SMS/WhatsApp
      responses:
        '200':
          description: OTP verified successfully, session token returned
          content:
            application/json:
              schema:
                type: string
                description: Session token (UUID format)
        '401':
          description: Invalid OTP or phone number

  /birthdateverify/{phoneNumber}:
    post:
      summary: Verify Birth Date and Get Token
      description: Verify birth date against customer records and receive session token
      parameters:
        - name: phoneNumber
          in: path
          required: true
          schema:
            type: string
          example: "8017190908"
          description: Phone number of the customer
        - name: region
          in: query
          required: false
          schema:
            type: string
            default: "US"
          description: Region code for phone number formatting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - dateOfBirth
              properties:
                dateOfBirth:
                  type: string
                  pattern: '^\d{8}$'
                  example: "08151990"
                  description: Date of birth in MMDDYYYY format (8 digits)
      responses:
        '200':
          description: Birth date verified successfully, session token returned
          content:
            application/json:
              schema:
                type: string
                description: Session token (UUID format)
        '400':
          description: Invalid birth date format or birth date doesn't match records
        '404':
          description: User or customer not found

  /sendtext:
    post:
      summary: Send WhatsApp/SMS Message
      description: Send a text message via SMS or WhatsApp
      security:
        - sessionToken: []
      parameters:
        - name: whatsApp
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Send via WhatsApp instead of SMS
        - name: region
          in: query
          required: false
          schema:
            type: string
            default: "US"
          description: Region code for WhatsApp messages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phoneNumber
                - message
              properties:
                phoneNumber:
                  type: string
                  example: "18017190908"
                  description: Recipient phone number
                message:
                  type: string
                  example: "10"
                  description: Message content
      responses:
        '200':
          description: Message sent successfully
        '401':
          description: Unauthorized - Invalid or missing session token

  /user/{username}:
    get:
      summary: Get User Information
      description: Retrieve user profile information for the authenticated user
      security:
        - sessionToken: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            format: email
          example: user@example.com
          description: Username (email address) of user to retrieve
      responses:
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  userName:
                    type: string
                    format: email
                    example: user@example.com
                    description: User's email address (username)
                  email:
                    type: string
                    format: email
                    example: user@example.com
                    description: User's email address
                  phone:
                    type: string
                    example: "+18017190908"
                    description: User's phone number
                  whatsAppPhone:
                    type: string
                    example: "+18017190908"
                    description: User's WhatsApp phone number
                  birthDate:
                    type: string
                    example: "2001-01-01"
                    description: User's birth date
                  deviceNickName:
                    type: string
                    example: "MyDevice"
                    description: User's device nickname
                  region:
                    type: string
                    example: "US"
                    description: User's region
                  expoPushToken:
                    type: string
                    description: Expo push notification token
                  locked:
                    type: boolean
                    example: false
                    description: Whether the user account is locked
                  agreedToTextMessageDate:
                    type: number
                    example: 1714444830351
                    description: Timestamp when user agreed to text messages
                  agreedToPrivacyPolicyDate:
                    type: number
                    example: 1714444830351
                    description: Timestamp when user agreed to privacy policy
                  agreedToCookiePolicyDate:
                    type: number
                    example: 1714444830351
                    description: Timestamp when user agreed to cookie policy
                  agreedToTermsOfUseDate:
                    type: number
                    example: 1714444830351
                    description: Timestamp when user agreed to terms of use
                  agreedToShareAnonymousData:
                    type: number
                    example: 1714444830351
                    description: Timestamp when user agreed to share anonymous data
        '401':
          description: Unauthorized - Invalid or missing session token
        '403':
          description: Forbidden - You can only view your own user information
        '404':
          description: User not found
    delete:
      summary: Delete User
      security:
        - sessionToken: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
