  # ---------------------------------------------------------------------------------------------
  # Phone-only sign-up and account recovery (plain-text replies)
  # ---------------------------------------------------------------------------------------------
  /signup/start:
    post:
      tags: [Sign-up & recovery]
      summary: Text a sign-up code to a new phone number
      description: |
        Sends a 4-digit code to a phone number that has no account yet. Any common style is accepted
        (8015550100, 801-555-0100, (801) 555-0100, +1 801 555 0100). Asking again replaces the old code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: 801-555-0100 }
                region: { type: string, default: US }
      responses:
        '200': { description: Code sent, content: { text/plain: { schema: { type: string, example: Ok } } } }
        '400': { description: Missing or invalid phone number }
        '409': { description: The phone number already has an account }
        '429': { description: A code was sent less than 30 seconds ago }

  /signup/verify:
    post:
      tags: [Sign-up & recovery]
      summary: Check the code and create the account
      description: |
        Creates a password-less account (SMS login only) plus the matching Customer, and returns a
        session token. Fields are checked before the code, so a typo doesn't use up a guess.
        A 409 keeps the code so the person can fix the field and try again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code, userName, fullName, recoveryEmail, agreedToTerms]
              properties:
                phone: { type: string, example: 801-555-0100 }
                region: { type: string, default: US }
                code: { type: string, example: "0482" }
                userName: { type: string, pattern: "^[a-z0-9_]{3,30}$", example: alexmorgan }
                fullName: { type: string, example: Alex Morgan }
                recoveryEmail: { type: string, format: email, example: alex@example.com }
                agreedToTerms: { type: boolean, example: true }
                wantsTips: { type: boolean, example: false }
      responses:
        '200': { description: "Account created; the body is the session token", content: { text/plain: { schema: { type: string, format: uuid } } } }
        '400': { description: "A field is invalid, or the code is wrong/expired (after 5 wrong guesses the code is deleted)" }
        '409': { description: "The phone, username or recovery email is already used" }

  /recovery/start:
    post:
      tags: [Sign-up & recovery]
      summary: Email a recovery code
      description: Always gives the same reply, whether or not the email belongs to an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recoveryEmail]
              properties:
                recoveryEmail: { type: string, format: email }
      responses:
        '200': { description: Same reply every time, content: { text/plain: { schema: { type: string, example: "If that email belongs to an account, we sent it a code." } } } }

  /recovery/verify:
    post:
      tags: [Sign-up & recovery]
      summary: Check the email code and text a code to the new phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recoveryEmail, code, newPhone]
              properties:
                recoveryEmail: { type: string, format: email }
                code: { type: string, example: "4518" }
                newPhone: { type: string, example: 801-555-0177 }
                region: { type: string, default: US }
      responses:
        '200': { description: Code texted to the new phone }
        '400': { description: "Invalid phone, or the email code is wrong/expired" }
        '409': { description: The new phone already belongs to an account }

  /recovery/confirm:
    post:
      tags: [Sign-up & recovery]
      summary: Check the text code, move the account to the new phone, and log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recoveryEmail, code]
              properties:
                recoveryEmail: { type: string, format: email }
                code: { type: string, example: "7731" }
      responses:
        '200': { description: "Account moved; the body is a session token", content: { text/plain: { schema: { type: string, format: uuid } } } }
        '400': { description: "The code is wrong/expired, or the recovery can't be finished" }
        '409': { description: The new phone was taken in the meantime }

  # ---------------------------------------------------------------------------------------------
  # Profiles (the account holder + family members)
  # ---------------------------------------------------------------------------------------------
  /profiles:
    get:
      tags: [Profiles]
      summary: List this account's profiles (the account holder first)
      description: The account holder's own profile is created from their Customer record the first time.
      security: [ { sessionToken: [] } ]
      responses:
        '200':
          description: Profiles
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Profile' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Profiles]
      summary: Add a family member (at most 10 profiles per account)
      security: [ { sessionToken: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProfileRequest' } } }
      responses:
        '201':
          description: Family member added
          content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /profiles/{id}:
    parameters: [ { $ref: '#/components/parameters/ProfileId' } ]
    get:
      tags: [Profiles]
      summary: Get one profile
      security: [ { sessionToken: [] } ]
      responses:
        '200': { description: The profile, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Profiles]
      summary: Edit a profile (only the fields sent)
      description: Edits to the account holder's own profile are also copied to their Customer record.
      security: [ { sessionToken: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProfileRequest' } } }
      responses:
        '200': { description: Updated profile, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Profiles]
      summary: Delete a family member, with their preferences and tests
      description: The account holder's own profile can't be deleted (400).
      security: [ { sessionToken: [] } ]
      responses:
        '200': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /profiles/{id}/preferences:
    parameters: [ { $ref: '#/components/parameters/ProfileId' } ]
    get:
      tags: [Balance preferences]
      summary: Get a profile's balance answers
      description: Before anything is saved, only profileId is returned.
      security: [ { sessionToken: [] } ]
      responses:
        '200': { description: The answers, content: { application/json: { schema: { $ref: '#/components/schemas/BalancePreferences' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Balance preferences]
      summary: Save all of a profile's balance answers
      security: [ { sessionToken: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feeling, improveGoal]
              properties:
                feeling: { type: string, enum: [poor, fair, ok, good, great] }
                improveGoal: { type: integer, minimum: 1, maximum: 10 }
                referralSource: { type: string, enum: [clinician, physical_therapist, friend_family, social_media, other] }
      responses:
        '200': { description: Saved answers, content: { application/json: { schema: { $ref: '#/components/schemas/BalancePreferences' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------------------------
  # Two-round Rapid Step Tests
  # ---------------------------------------------------------------------------------------------
  /profiles/{id}/tests:
    parameters: [ { $ref: '#/components/parameters/ProfileId' } ]
    post:
      tags: [Balance tests]
      summary: Save a test for this profile
      description: |
        complete = rounds 1 and 2 with 30 stepPoints each. stopped = ended early: every round but the
        last has 30 steps and the last has 0-29 (saved, never scored). Times must be within the last
        30 days and not in the future. The server works out stopTime, durations, stepCount,
        totalTimeMs and avgIntervalMs. Safe to resend: the same clientTestId returns the first copy (200).
      security: [ { sessionToken: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BalanceTestRequest' } } }
      responses:
        '201': { description: Test saved, content: { application/json: { schema: { $ref: '#/components/schemas/BalanceTest' } } } }
        '200': { description: "Already saved (same clientTestId); the first copy is returned", content: { application/json: { schema: { $ref: '#/components/schemas/BalanceTest' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [Balance tests]
      summary: List this profile's tests, newest first
      security: [ { sessionToken: [] } ]
      parameters:
        - { name: from, in: query, required: false, schema: { type: integer, format: int64 }, description: "Only tests finished at or after this time (ms since 1970)" }
        - { name: to, in: query, required: false, schema: { type: integer, format: int64 }, description: "Only tests finished at or before this time (ms since 1970)" }
      responses:
        '200':
          description: Tests
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BalanceTest' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tests/{testId}:
    get:
      tags: [Balance tests]
      summary: Get one test
      security: [ { sessionToken: [] } ]
      parameters:
        - { name: testId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The test, content: { application/json: { schema: { $ref: '#/components/schemas/BalanceTest' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------------------------
  # Paired STEDI sensors
  # ---------------------------------------------------------------------------------------------
  /devices:
    get:
      tags: [Devices]
      summary: List paired devices (the active one first)
      security: [ { sessionToken: [] } ]
      responses:
        '200':
          description: Devices
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/UserDevice' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Devices]
      summary: Pair a device (the first one paired becomes active)
      security: [ { sessionToken: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string, pattern: "^[A-Za-z0-9._:-]{3,64}$", example: STEDI-0241 }
                nickname: { type: string, maxLength: 40 }
                location: { type: string, maxLength: 40, example: Living room }
      responses:
        '201': { description: Paired, content: { application/json: { schema: { $ref: '#/components/schemas/UserDevice' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /devices/{deviceId}:
    parameters: [ { $ref: '#/components/parameters/DeviceId' } ]
    patch:
      tags: [Devices]
      summary: Rename, move, or make this the active device
      security: [ { sessionToken: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: { type: string, maxLength: 40 }
                location: { type: string, maxLength: 40 }
                active: { type: boolean, description: true makes this the device used for tests }
      responses:
        '200': { description: Updated device, content: { application/json: { schema: { $ref: '#/components/schemas/UserDevice' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Devices]
      summary: Unpair a device
      description: If it was the active device, the most recently paired remaining device becomes active.
      security: [ { sessionToken: [] } ]
      responses:
        '200': { description: Unpaired }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------------------------
  # Support
  # ---------------------------------------------------------------------------------------------
  /contact:
    post:
      tags: [Support]
      summary: Send a message to STEDI support
      description: |
        Older apps send name, toAddress, subject and messageText. The redesigned app can also send
        category and replyEmail (used when toAddress is left out). Limited to one message per account
        every 30 seconds. With CONTACT_EMAIL_DISABLED=true the email is logged instead of sent.
      security: [ { sessionToken: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messageText]
              properties:
                name: { type: string, example: Alex Morgan }
                toAddress: { type: string, format: email }
                replyEmail: { type: string, format: email, example: alex.morgan@example.com }
                category: { type: string, enum: [app, device, account, data] }
                subject: { type: string, maxLength: 120, example: "Trouble reconnecting STEDI · 0241" }
                messageText: { type: string, maxLength: 2000 }
      responses:
        '200': { description: Sent, content: { text/plain: { schema: { type: string, example: sent } } } }
        '400': { description: Missing or invalid field }
        '401': { description: Missing or invalid session token }
        '429': { description: More than one message in 30 seconds }
